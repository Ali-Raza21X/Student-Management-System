{% extends "base.html" %}

{% block title %}Delete_Teachers{% endblock %}

{% block content %}

<h2>Delete Teachers</h2>

<p>Are you sure you want to delete {{ teacher.name }}?</p>

<form method="POST">
    {% csrf_token %}

    <button type="submit">Yes, Delete</button>

    <a href="{% url 'view_teachers' %}">Cancel</a>
</form>

{% endblock %}
