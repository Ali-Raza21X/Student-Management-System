{% extends "base.html" %}

{% block title %}
    Add Subject
{% endblock %}

{% block content %}

<div class="page-section">

    <!-- PAGE HEADER -->

    <div class="page-title">

        <div>

            <span class="text-muted">
                Administration
            </span>

            <h1>
                Add Subject
            </h1>

            <p class="text-muted mb-0">
                Create a new subject and assign it to a class and teacher.
            </p>

        </div>

        <a
            href="{% url 'view_subject' %}"
            class="btn btn-outline-secondary"
        >

            <i class='bx bx-arrow-back'></i>

            Subjects

        </a>

    </div>


    <!-- FORM -->

    <div class="dashboard-panel form-panel">

        <div class="panel-header">

            <div>

                <h3>
                    Subject Information
                </h3>

                <span>
                    Enter the subject details below
                </span>

            </div>

        </div>


        <form method="post" class="management-form">

            {% csrf_token %}

            {{ form.as_p }}


            <div class="form-actions">

                <button
                    type="submit"
                    class="btn btn-primary"
                >

                    <i class='bx bx-book-add'></i>

                    Add Subject

                </button>


                <a
                    href="{% url 'view_subject' %}"
                    class="btn btn-outline-secondary"
                >

                    Cancel

                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
